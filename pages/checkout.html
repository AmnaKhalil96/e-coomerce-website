<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Checkout | Exclusive
    </title>
    
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { poppins: ['Poppins', 'sans-serif'] }, colors: { exclusive: '#DB4444', ink: '#000000', muted: '#7D8184', pale: '#F5F5F5', line: '#E8E8E8', music: '#00FF66' } } } };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body data-page="checkout" class="m-0 min-h-screen bg-white font-poppins text-[16px] text-black antialiased">
    
    <div id="site-topbar">
    </div>
    <div id="site-header">
    </div>
    <!-- Checkout breadcrumb, billing fields, and order summary. -->
    <main class="mx-auto w-[1170px] pb-[135px] max-[1200px]:w-[calc(100%-48px)] max-[680px]:w-[calc(100%-32px)]">
      <nav class="mt-[72px] flex items-center gap-[14px] text-[14px] text-[#888888] max-[680px]:mt-[34px] max-[680px]:flex-wrap max-[680px]:text-[12px]" aria-label="Breadcrumb">
        <a href="account.html">
          Account
        </a>
        <span>
          /
        </span>
        <a href="account.html">
          My Account
        </a>
        <span>
          /
        </span>
        <a href="product-details.html">
          Product
        </a>
        <span>
          /
        </span>
        <a href="cart.html">
          View Cart
        </a>
        <span>
          /
        </span>
        <b class="font-normal text-[#111111]">
          CheckOut
        </b>
      </nav>
      <div class="mt-[72px] grid grid-cols-[460px_1fr] gap-[168px] max-[1200px]:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] max-[1200px]:gap-16 max-[900px]:grid-cols-1 max-[900px]:gap-10 max-[680px]:mt-10">
        <!-- Required billing inputs retain the reference labels and order. -->
        <form id="checkout-form" novalidate>
          <h1 class="mb-[35px] mt-0 text-[36px] font-medium leading-[1.2] max-[680px]:text-[30px]">
            Billing Details
          </h1>
          <div class="flex flex-col gap-[27px]">
            <label class="block text-[16px] text-[#7D8184]">
              First Name
              <span class="text-exclusive">
                *
              </span>
              <input id="billing-first-name" class="mt-2 block h-[50px] w-full rounded bg-pale px-4 text-black outline-none focus:ring-1 focus:ring-exclusive" type="text" required>
            </label>
            <label class="block text-[16px] text-[#7D8184]">
              Company Name
              <input class="mt-2 block h-[50px] w-full rounded bg-pale px-4 text-black outline-none focus:ring-1 focus:ring-exclusive" type="text">
            </label>
            <label class="block text-[16px] text-[#7D8184]">
              Street Address
              <span class="text-exclusive">
                *
              </span>
              <input id="billing-address" class="mt-2 block h-[50px] w-full rounded bg-pale px-4 text-black outline-none focus:ring-1 focus:ring-exclusive" type="text" required>
            </label>
            <label class="block text-[16px] text-[#7D8184]">
              Apartment, floor, etc. (optional)
              <input class="mt-2 block h-[50px] w-full rounded bg-pale px-4 text-black outline-none focus:ring-1 focus:ring-exclusive" type="text">
            </label>
            <label class="block text-[16px] text-[#7D8184]">
              Town/City
              <span class="text-exclusive">
                *
              </span>
              <input id="billing-city" class="mt-2 block h-[50px] w-full rounded bg-pale px-4 text-black outline-none focus:ring-1 focus:ring-exclusive" type="text" required>
            </label>
            <label class="block text-[16px] text-[#7D8184]">
              Phone Number
              <span class="text-exclusive">
                *
              </span>
              <input id="billing-phone" class="mt-2 block h-[50px] w-full rounded bg-pale px-4 text-black outline-none focus:ring-1 focus:ring-exclusive" type="tel" required>
            </label>
            <label class="block text-[16px] text-[#7D8184]">
              Email Address
              <span class="text-exclusive">
                *
              </span>
              <input id="billing-email" class="mt-2 block h-[50px] w-full rounded bg-pale px-4 text-black outline-none focus:ring-1 focus:ring-exclusive" type="email" required>
            </label>
          </div>
          <label class="mt-6 flex items-center gap-3 text-[16px]">
            <input class="h-6 w-6 accent-exclusive" type="checkbox">
            <span>
              Save this information for faster check-out next time
            </span>
          </label>
        </form>
        <!-- Order lines, totals, payment options, and coupon field. -->
        <section class="pt-[95px] max-[900px]:pt-0" aria-label="Order summary">
          <div class="space-y-6">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-5">
                <img class="h-12 w-12 object-contain" src="../assets/images/products/ips-lcd-gaming-monitor.png" alt="LCD Monitor">
                <span>
                  LCD Monitor
                </span>
              </div>
              <span>
                $650
              </span>
            </div>
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-5">
                <img class="h-12 w-12 object-contain" src="../assets/images/products/havit-hv-g92-gamepad.png" alt="H1 Gamepad">
                <span>
                  H1 Gamepad
                </span>
              </div>
              <span>
                $1100
              </span>
            </div>
          </div>
          <div class="mt-7 text-[16px]">
            <div class="flex justify-between border-b border-[#AAAAAA] py-4">
              <span>
                Subtotal:
              </span>
              <span>
                $1750
              </span>
            </div>
            <div class="flex justify-between border-b border-[#AAAAAA] py-4">
              <span>
                Shipping:
              </span>
              <span>
                Free
              </span>
            </div>
            <div class="flex justify-between py-4">
              <span>
                Total:
              </span>
              <span>
                $1750
              </span>
            </div>
          </div>
          <!-- Bank and cash payment choices with the supplied payment logos. -->
          <fieldset class="mt-2 space-y-5 border-0 p-0">
            <legend class="sr-only">
              Payment method
            </legend>
            <label class="flex items-center gap-4">
              <input class="h-6 w-6 accent-black" type="radio" name="payment" value="bank">
              <span>
                Bank
              </span>
              <span class="ml-auto flex items-center gap-2">
                <img class="h-5 w-10 object-contain" src="../assets/images/shared/bkash.png" alt="bKash">
                <img class="h-5 w-10 object-contain" src="../assets/images/shared/visa.png" alt="VISA">
                <img class="h-5 w-10 object-contain" src="../assets/images/shared/mastercard.png" alt="Mastercard">
                <img class="h-5 w-10 object-contain" src="../assets/images/shared/nagad.png" alt="Nagad">
              </span>
            </label>
            <label class="flex items-center gap-4">
              <input class="h-6 w-6 accent-black" type="radio" name="payment" value="cash" checked>
              <span>
                Cash on delivery
              </span>
            </label>
          </fieldset>
          <!-- Coupon application is shown but does not claim an online discount. -->
          <form id="checkout-coupon" class="mt-[30px] flex gap-4 max-[680px]:flex-col" novalidate>
            <label class="sr-only" for="checkout-coupon-code">
              Coupon Code
            </label>
            <input id="checkout-coupon-code" class="h-[55px] min-w-0 flex-1 rounded border border-[#111111] px-5 outline-none" placeholder="Coupon Code">
            <button class="h-[55px] rounded bg-exclusive px-10 text-white max-[680px]:w-full" type="submit">
              Apply Coupon
            </button>
          </form>
          <p id="checkout-feedback" class="mt-4 hidden text-[14px] text-exclusive" role="alert" aria-live="polite">
          </p>
          <button class="mt-[30px] h-[55px] w-[186px] rounded bg-exclusive text-white max-[680px]:w-full" form="checkout-form" type="submit">
            Place Order
          </button>
        </section>
      </div>
    </main>
    
    <div id="site-footer">
    </div>
    
    <script src="../js/layout.js">
    </script>
    <script src="../js/checkout.js">
    </script>
  </body>
</html>
