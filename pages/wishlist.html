<!doctype html>
<html lang="en">
<head>

  <title>Wishlist | Exclusive</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { poppins: ['Poppins', 'sans-serif'] }, colors: { exclusive: '#DB4444', ink: '#000000', muted: '#7D8184', pale: '#F5F5F5', line: '#E8E8E8', music: '#00FF66' } } } };</script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body data-page="wishlist" class="m-0 min-h-screen bg-white font-poppins text-[16px] text-black antialiased overflow-x-clip">
  
  <div id="site-topbar"></div><div id="site-header"></div>
  <!-- Saved items and the reference's recommended product row. -->

        <h1 id="wishlist-heading" class="m-0 text-base font-normal sm:text-[20px]">Wishlist (4)</h1>
        <button id="move-all" class="h-14 rounded border border-[#999999] bg-white px-[42px] text-[16px] font-medium max-[680px]:h-[46px] max-[680px]:px-[18px] max-[680px]:text-[13px] max-[480px]:w-full" type="button">Move All To Bag</button>
      </div>

        <!-- Saved product: Gucci duffle bag. -->
        <article class="wishlist-card min-w-0">
          <div class="relative grid h-[170px] place-items-center overflow-hidden rounded bg-pale sm:h-[216px]"><img class="h-[82%] w-[82%] object-contain" src="../assets/images/products/gucci-duffle-bag.png" alt="Gucci duffle bag"><span class="absolute left-2 top-2 rounded bg-exclusive px-2 py-1 text-[10px] text-white sm:left-3 sm:top-3 sm:px-3 sm:text-[12px]">-35%</span><button class="remove-item absolute right-2 top-2 grid h-7 w-7 place-items-center rounded-full bg-white sm:right-3 sm:top-3 sm:h-[34px] sm:w-[34px]" type="button" aria-label="Remove Gucci duffle bag"><img class="h-[22px] w-[22px] max-[680px]:h-[19px] max-[680px]:w-[19px]" src="../assets/images/wishlist/delete-item.png" alt=""></button></div>
          <button class="move-item flex h-11 w-full items-center justify-center gap-2 whitespace-nowrap rounded-b bg-black py-2 text-sm text-white sm:h-10 sm:text-[14px]" type="button"><img class="h-5 w-5" src="../assets/images/wishlist/add-to-cart.png" alt="">Add To Cart</button>
          <h2 class="mb-1 mt-3 line-clamp-2 min-h-10 text-sm font-medium leading-snug sm:mb-2 sm:mt-4 sm:text-[16px]">Gucci duffle bag</h2><div class="whitespace-nowrap text-sm text-exclusive sm:text-[16px]">$960 <span class="ml-[14px] text-[#888888] line-through max-[680px]:ml-[7px]">$1160</span></div>
        </article>
        <!-- Saved product: RGB liquid CPU Cooler. -->
        <article class="wishlist-card min-w-0">
          <div class="relative grid h-[170px] place-items-center overflow-hidden rounded bg-pale sm:h-[216px]"><img class="h-[82%] w-[82%] object-contain" src="../assets/images/products/rgb-liquid-cpu-cooler.png" alt="RGB liquid CPU Cooler"><button class="remove-item absolute right-2 top-2 grid h-7 w-7 place-items-center rounded-full bg-white sm:right-3 sm:top-3 sm:h-[34px] sm:w-[34px]" type="button" aria-label="Remove RGB liquid CPU Cooler"><img class="h-[22px] w-[22px] max-[680px]:h-[19px] max-[680px]:w-[19px]" src="../assets/images/wishlist/delete-item.png" alt=""></button></div>

          <h2 class="mb-1 mt-3 line-clamp-2 min-h-10 text-sm font-medium leading-snug sm:mb-2 sm:mt-4 sm:text-[16px]">RGB liquid CPU Cooler</h2><div class="whitespace-nowrap text-sm text-exclusive sm:text-[16px]">$1960</div>
        </article>
        <!-- Saved product: GP11 Shooter USB Gamepad. -->
        <article class="wishlist-card min-w-0">
          <div class="relative grid h-[170px] place-items-center overflow-hidden rounded bg-pale sm:h-[216px]"><img class="h-[82%] w-[82%] object-contain" src="../assets/images/products/gp11-shooter-gamepad.png" alt="GP11 Shooter USB Gamepad"><button class="remove-item absolute right-2 top-2 grid h-7 w-7 place-items-center rounded-full bg-white sm:right-3 sm:top-3 sm:h-[34px] sm:w-[34px]" type="button" aria-label="Remove GP11 Shooter USB Gamepad"><img class="h-[22px] w-[22px] max-[680px]:h-[19px] max-[680px]:w-[19px]" src="../assets/images/wishlist/delete-item.png" alt=""></button></div>

        </article>
        <!-- Saved product: Quilted Satin Jacket. -->
        <article class="wishlist-card min-w-0">
          <div class="relative grid h-[170px] place-items-center overflow-hidden rounded bg-pale sm:h-[216px]"><img class="h-[82%] w-[82%] object-contain" src="../assets/images/products/quilted-satin-jacket.png" alt="Quilted Satin Jacket"><button class="remove-item absolute right-2 top-2 grid h-7 w-7 place-items-center rounded-full bg-white sm:right-3 sm:top-3 sm:h-[34px] sm:w-[34px]" type="button" aria-label="Remove Quilted Satin Jacket"><img class="h-[22px] w-[22px] max-[680px]:h-[19px] max-[680px]:w-[19px]" src="../assets/images/wishlist/delete-item.png" alt=""></button></div>

    <section class="mt-10 sm:mt-14" aria-label="Recommended products">

      </div>
      <div class="grid grid-cols-2 gap-x-3 gap-y-8 md:grid-cols-3 lg:grid-cols-4 xl:gap-x-[30px] xl:gap-y-[54px]">
        <!-- Recommendation: ASUS FHD Gaming Laptop. -->
        <article class="min-w-0"><div class="relative grid h-[170px] place-items-center overflow-hidden rounded bg-pale sm:h-[216px]"><img class="h-[82%] w-[82%] object-contain" src="../assets/images/products/asus-fhd-gaming-laptop.png" alt="ASUS FHD Gaming Laptop"><span class="absolute left-2 top-2 rounded bg-exclusive px-2 py-1 text-[10px] text-white sm:left-3 sm:top-3 sm:px-3 sm:text-[12px]">-35%</span><button class="absolute right-2 top-2 grid h-7 w-7 place-items-center rounded-full bg-white sm:right-3 sm:top-3 sm:h-[34px] sm:w-[34px]" type="button" aria-label="View ASUS FHD Gaming Laptop"><img class="h-[22px] w-[22px]" src="../assets/images/shared/quick-view.png" alt=""></button></div><button class="move-item flex h-11 w-full items-center justify-center gap-2 whitespace-nowrap rounded-b bg-black py-2 text-sm text-white sm:h-10 sm:text-[14px]" type="button"><img class="h-5 w-5" src="../assets/images/wishlist/add-to-cart.png" alt="">Add To Cart</button><h3 class="mb-1 mt-3 line-clamp-2 min-h-10 text-sm font-medium leading-snug sm:mb-2 sm:mt-4 sm:text-[16px]">ASUS FHD Gaming Laptop</h3><div class="whitespace-nowrap text-sm text-exclusive sm:text-[16px]">$960 <span class="ml-[14px] text-[#888888] line-through">$1160</span></div></article>
        <!-- Recommendation: IPS LCD Gaming Monitor. -->
        <article class="min-w-0"><div class="relative grid h-[170px] place-items-center overflow-hidden rounded bg-pale sm:h-[216px]"><img class="h-[82%] w-[82%] object-contain" src="../assets/images/products/ips-lcd-gaming-monitor.png" alt="IPS LCD Gaming Monitor"><button class="absolute right-2 top-2 grid h-7 w-7 place-items-center rounded-full bg-white sm:right-3 sm:top-3 sm:h-[34px] sm:w-[34px]" type="button" aria-label="View IPS LCD Gaming Monitor"><img class="h-[22px] w-[22px]" src="../assets/images/shared/quick-view.png" alt=""></button></div><button class="move-item flex h-11 w-full items-center justify-center gap-2 whitespace-nowrap rounded-b bg-black py-2 text-sm text-white sm:h-10 sm:text-[14px]" type="button"><img class="h-5 w-5" src="../assets/images/wishlist/add-to-cart.png" alt="">Add To Cart</button><h3 class="mb-1 mt-3 line-clamp-2 min-h-10 text-sm font-medium leading-snug sm:mb-2 sm:mt-4 sm:text-[16px]">IPS LCD Gaming Monitor</h3><div class="whitespace-nowrap text-sm text-exclusive sm:text-[16px]">$1160</div></article>
        <!-- Recommendation: HAVIT HV-G92 Gamepad. -->
        <article class="min-w-0"><div class="relative grid h-[170px] place-items-center overflow-hidden rounded bg-pale sm:h-[216px]"><img class="h-[82%] w-[82%] object-contain" src="../assets/images/products/havit-hv-g92-gamepad.png" alt="HAVIT HV-G92 Gamepad"><span class="absolute left-2 top-2 rounded bg-music px-2 py-1 text-[10px] text-black sm:left-3 sm:top-3 sm:px-3 sm:text-[12px]">NEW</span><button class="absolute right-2 top-2 grid h-7 w-7 place-items-center rounded-full bg-white sm:right-3 sm:top-3 sm:h-[34px] sm:w-[34px]" type="button" aria-label="View HAVIT HV-G92 Gamepad"><img class="h-[22px] w-[22px]" src="../assets/images/shared/quick-view.png" alt=""></button></div><button class="move-item flex h-11 w-full items-center justify-center gap-2 whitespace-nowrap rounded-b bg-black py-2 text-sm text-white sm:h-10 sm:text-[14px]" type="button"><img class="h-5 w-5" src="../assets/images/wishlist/add-to-cart.png" alt="">Add To Cart</button><h3 class="mb-1 mt-3 line-clamp-2 min-h-10 text-sm font-medium leading-snug sm:mb-2 sm:mt-4 sm:text-[16px]">HAVIT HV-G92 Gamepad</h3><div class="whitespace-nowrap text-sm text-exclusive sm:text-[16px]">$560</div></article>
        <!-- Recommendation: AK-900 Wired Keyboard. -->
        <article class="min-w-0"><div class="relative grid h-[170px] place-items-center overflow-hidden rounded bg-pale sm:h-[216px]"><img class="h-[82%] w-[82%] object-contain" src="../assets/images/products/ak-900-wired-keyboard.png" alt="AK-900 Wired Keyboard"><button class="absolute right-2 top-2 grid h-7 w-7 place-items-center rounded-full bg-white sm:right-3 sm:top-3 sm:h-[34px] sm:w-[34px]" type="button" aria-label="View AK-900 Wired Keyboard"><img class="h-[22px] w-[22px]" src="../assets/images/shared/quick-view.png" alt=""></button></div><button class="move-item flex h-11 w-full items-center justify-center gap-2 whitespace-nowrap rounded-b bg-black py-2 text-sm text-white sm:h-10 sm:text-[14px]" type="button"><img class="h-5 w-5" src="../assets/images/wishlist/add-to-cart.png" alt="">Add To Cart</button><h3 class="mb-1 mt-3 line-clamp-2 min-h-10 text-sm font-medium leading-snug sm:mb-2 sm:mt-4 sm:text-[16px]">AK-900 Wired Keyboard</h3><div class="whitespace-nowrap text-sm text-exclusive sm:text-[16px]">$200</div></article>
      </div>
    </section>
  </main>
  
  <div id="site-footer"></div>
  
  <script src="../js/layout.js"></script>
  <script src="../js/wishlist.js"></script>
</body>
</html>
