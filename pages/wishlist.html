  <link rel="preconnect" href="https://fonts.googleapis.com">

        <article class="wishlist-card min-w-0">

        <!-- Recommendation: ASUS FHD Gaming Laptop. -->

        <article class="min-w-0"><div class="relative grid h-[216px] place-items-center overflow-hidden rounded bg-pale max-[680px]:h-[clamp(145px,48vw,220px)] max-[390px]:h-[230px]"><img class="h-[82%] w-[82%] object-contain" src="../assets/images/products/ips-lcd-gaming-monitor.png" alt="IPS LCD Gaming Monitor"><button class="absolute right-3 top-3 grid h-[34px] w-[34px] place-items-center rounded-full bg-white" type="button" aria-label="View IPS LCD Gaming Monitor"><img class="h-[22px] w-[22px]" src="../assets/images/shared/quick-view.png" alt=""></button></div><button class="move-item flex h-10 w-full items-center justify-center gap-2 rounded-b bg-black text-[14px] text-white max-[680px]:h-9 max-[680px]:text-[12px]" type="button"><img class="h-5 w-5" src="../assets/images/wishlist/add-to-cart.png" alt="">Add To Cart</button><h3 class="mb-2 mt-4 text-[16px] font-medium max-[680px]:mb-[5px] max-[680px]:mt-[11px] max-[680px]:text-[14px]">IPS LCD Gaming Monitor</h3><div class="text-[16px] text-exclusive max-[680px]:text-[14px]">$1160</div></article>
        <!-- Recommendation: HAVIT HV-G92 Gamepad. -->
        <article class="min-w-0"><div class="relative grid h-[216px] place-items-center overflow-hidden rounded bg-pale max-[680px]:h-[clamp(145px,48vw,220px)] max-[390px]:h-[230px]"><img class="h-[82%] w-[82%] object-contain" src="../assets/images/products/havit-hv-g92-gamepad.png" alt="HAVIT HV-G92 Gamepad"><span class="absolute left-3 top-3 rounded bg-music px-3 py-1 text-[12px] text-black">NEW</span><button class="absolute right-3 top-3 grid h-[34px] w-[34px] place-items-center rounded-full bg-white" type="button" aria-label="View HAVIT HV-G92 Gamepad"><img class="h-[22px] w-[22px]" src="../assets/images/shared/quick-view.png" alt=""></button></div><button class="move-item flex h-10 w-full items-center justify-center gap-2 rounded-b bg-black text-[14px] text-white max-[680px]:h-9 max-[680px]:text-[12px]" type="button"><img class="h-5 w-5" src="../assets/images/wishlist/add-to-cart.png" alt="">Add To Cart</button><h3 class="mb-2 mt-4 text-[16px] font-medium max-[680px]:mb-[5px] max-[680px]:mt-[11px] max-[680px]:text-[14px]">HAVIT HV-G92 Gamepad</h3><div class="text-[16px] text-exclusive max-[680px]:text-[14px]">$560</div></article>
        <!-- Recommendation: AK-900 Wired Keyboard. -->
        <article class="min-w-0"><div class="relative grid h-[216px] place-items-center overflow-hidden rounded bg-pale max-[680px]:h-[clamp(145px,48vw,220px)] max-[390px]:h-[230px]"><img class="h-[82%] w-[82%] object-contain" src="../assets/images/products/ak-900-wired-keyboard.png" alt="AK-900 Wired Keyboard"><button class="absolute right-3 top-3 grid h-[34px] w-[34px] place-items-center rounded-full bg-white" type="button" aria-label="View AK-900 Wired Keyboard"><img class="h-[22px] w-[22px]" src="../assets/images/shared/quick-view.png" alt=""></button></div><button class="move-item flex h-10 w-full items-center justify-center gap-2 rounded-b bg-black text-[14px] text-white max-[680px]:h-9 max-[680px]:text-[12px]" type="button"><img class="h-5 w-5" src="../assets/images/wishlist/add-to-cart.png" alt="">Add To Cart</button><h3 class="mb-2 mt-4 text-[16px] font-medium max-[680px]:mb-[5px] max-[680px]:mt-[11px] max-[680px]:text-[14px]">AK-900 Wired Keyboard</h3><div class="text-[16px] text-exclusive max-[680px]:text-[14px]">$200</div></article>
      </div>
    </section>
  </main>
  
  <div id="site-footer"></div>
  
  <script src="../js/layout.js"></script>
  <script src="../js/wishlist.js"></script>
</body>
</html>
