<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Not Found | Exclusive</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { poppins: ['Poppins', 'sans-serif'] }, colors: { exclusive: '#DB4444', ink: '#000000', muted: '#7D8184', pale: '#F5F5F5', line: '#E8E8E8', music: '#00FF66' } } } };</script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body data-page="404" class="m-0 min-h-screen bg-white font-poppins text-[16px] text-black antialiased overflow-x-clip">
  
  <div id="site-topbar"></div><div id="site-header"></div>
  <!-- Error breadcrumb, message, and return-to-home action. -->
    <!-- Responsive error text scales down while its action stays centered. -->
<main class="relative mx-auto h-[540px] w-full max-w-[1170px] px-4 sm:h-[620px] sm:px-6 xl:h-[702px] xl:w-[1170px] xl:px-0">
    <nav class="mt-[82px] flex items-center gap-[14px] text-[14px] text-[#888888] max-[680px]:mt-[34px] max-[680px]:text-[13px]" aria-label="Breadcrumb"><a href="../index.html">Home</a><span>/</span><b class="font-normal text-[#111111]">404 Error</b></nav>
    <section class="absolute left-1/2 top-1/2 w-[min(850px,100%)] -translate-x-1/2 -translate-y-1/2 text-center xl:top-[60%]" aria-labelledby="error-title">
      <h1 id="error-title" class="mb-6 mt-0 text-5xl font-medium leading-[1.1] tracking-normal sm:text-7xl sm:tracking-[2px] xl:mb-[34px] xl:text-[96px]">404 Not Found</h1>
      <p class="m-0 text-[18px] max-[680px]:text-[15px]">Your visited page not found. You may go home page.</p>
      <a class="mx-auto mt-12 inline-flex h-14 w-full max-w-[255px] items-center justify-center rounded bg-exclusive text-[16px] text-white sm:mt-16 xl:mt-20" href="../index.html">Back to home page</a>
    </section>
  </main>
  
  <div id="site-footer"></div>
  
  <script src="../js/layout.js"></script>
</body>
</html>
