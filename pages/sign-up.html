<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account | Exclusive</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { poppins: ['Poppins', 'sans-serif'] }, colors: { exclusive: '#DB4444', ink: '#000000', muted: '#7D8184', pale: '#F5F5F5', line: '#E8E8E8', music: '#00FF66' } } } };</script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body data-page="signup" class="m-0 min-h-screen bg-white font-poppins text-[16px] text-black antialiased">
  
  <div id="site-topbar"></div><div id="site-header"></div>
  <!-- Sign-up page split illustration and account form. -->
  <main class="py-[75px] pb-[215px] max-[680px]:py-[30px] max-[680px]:pb-[70px]">
    <div class="grid w-full grid-cols-[minmax(0,740px)_370px] items-center gap-[105px] max-[1240px]:w-[calc(100%-40px)] max-[1240px]:grid-cols-[minmax(0,1fr)_350px] max-[1240px]:gap-10 max-[1000px]:grid-cols-[minmax(0,1fr)_350px] max-[1000px]:gap-10 max-[680px]:w-full max-[680px]:grid-cols-1 max-[680px]:gap-[35px]">
      <div class="h-[695px] overflow-hidden rounded-r-[4px] max-[1240px]:h-[min(54vw,665px)] max-[1000px]:h-[520px] max-[680px]:h-auto max-[680px]:max-h-[360px] max-[680px]:rounded-none">
        <img class="h-full w-full object-cover max-[680px]:block max-[680px]:h-auto max-[680px]:max-h-[360px]" src="../assets/images/login/account-shopping.jpg" alt="Shopping cart, bags, and a phone">
      </div>
      <form id="signup-form" class="w-full max-w-[370px] translate-y-[50px] max-[1240px]:max-w-[350px] max-[680px]:mx-auto max-[680px]:max-w-[calc(100%-48px)] max-[680px]:translate-y-0" novalidate>
        <h1 class="mb-[10px] mt-0 text-[36px] font-medium leading-[1.3] tracking-[1.2px] max-[680px]:text-[30px]">Create an account</h1>
        <p class="mb-[42px] mt-0 text-[16px] max-[680px]:mb-8">Enter your details below</p>
        <div class="flex flex-col gap-7 max-[680px]:gap-[22px]">
          <label class="block"><span class="sr-only">Name</span><input id="signup-name" class="h-11 w-full border-0 border-b border-[#999999] bg-transparent pb-2 text-[16px] outline-none focus:border-black" type="text" autocomplete="name" placeholder="Name" required></label>
          <label class="block"><span class="sr-only">Email or Phone Number</span><input id="signup-identity" class="h-11 w-full border-0 border-b border-[#999999] bg-transparent pb-2 text-[16px] outline-none focus:border-black" type="text" autocomplete="username" placeholder="Email or Phone Number" required></label>
          <label class="block"><span class="sr-only">Password</span><input id="signup-password" class="h-11 w-full border-0 border-b border-[#999999] bg-transparent pb-2 text-[16px] outline-none focus:border-black" type="password" autocomplete="new-password" placeholder="Password" required></label>
        </div>
        <p id="signup-error" class="mt-3 hidden text-[13px] text-exclusive" role="alert" aria-live="polite"></p>
        <button class="mt-[42px] h-14 w-full rounded bg-exclusive px-8 text-[16px] text-white max-[680px]:mt-[30px]" type="submit">Create Account</button>
        <button class="mt-4 flex h-14 w-full items-center justify-center gap-[14px] rounded border border-[#999999] bg-white text-[16px]" type="button" id="google-signup"><img class="h-6 w-6" src="../assets/images/login/google-logo.png" alt="">Sign up with Google</button>
        <p class="mb-0 mt-[34px] text-center text-[#777777]">Already have account? <a class="ml-[14px] text-black underline underline-offset-[5px]" href="login.html">Log in</a></p>
      </form>
    </div>
  </main>
  
  <div id="site-footer"></div>
  
  <script src="../js/layout.js"></script>
  <script src="../js/sign-up.js"></script>
</body>
</html>
